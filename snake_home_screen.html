<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake">
<meta name="theme-color" content="#111318">
<title>Snake</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#191c22;--grid:#242831;--snake:#58d66b;--head:#83ef8d;--food:#ff5b62;--text:#f5f7fa;--muted:#9aa2ad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;touch-action:none}
body{display:flex;justify-content:center}
.app{width:min(760px,100%);padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;align-items:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:4px 2px 12px}
.title{font-size:30px;font-weight:800;letter-spacing:-1px}
.stats{display:flex;gap:10px}.stat{background:var(--panel);border-radius:12px;padding:7px 11px;text-align:center;min-width:78px}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{font-size:18px}
.game{position:relative;width:min(92vw,640px);aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:0 0 0 2px #2b3039;background:#17191e}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,15,.58);backdrop-filter:blur(3px);text-align:center;padding:24px}
.overlay.hidden{display:none}.card{background:rgba(25,28,34,.94);border:1px solid #343944;border-radius:20px;padding:24px;max-width:330px}.card h2{margin:0 0 8px;font-size:34px}.card p{margin:0;color:var(--muted);line-height:1.4}
.controls{width:min(330px,90vw);display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
button{font:inherit;border:0;color:var(--text);background:#292e37;border-radius:15px;min-height:58px;font-size:28px;font-weight:800;box-shadow:inset 0 -3px rgba(0,0,0,.25);touch-action:manipulation}
button:active{transform:scale(.95);background:#353b46}
.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}
.actions{display:flex;gap:9px;width:min(330px,90vw);margin-top:10px}.actions button{flex:1;font-size:16px;min-height:48px}.primary{background:#347a45}
.tip{color:var(--muted);font-size:13px;text-align:center;margin:9px 0 0}
@media (orientation:landscape) and (max-height:700px){.app{padding-top:8px}.top{padding-bottom:6px}.game{width:min(62vh,620px)}.controls{position:absolute;left:-9999px}.actions{margin-top:8px}}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="top">
    <div class="title">🐍 Snake</div>
    <div class="stats"><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>BEST</small><b id="best">0</b></div></div>
  </div>
  <section class="game" aria-label="Snake game">
    <canvas id="board" width="600" height="600"></canvas>
    <div class="overlay" id="overlay">
      <div class="card"><h2 id="overlayTitle">Snake</h2><p id="overlayText">Tap a direction or swipe the board to start.</p></div>
    </div>
  </section>
  <div class="controls" aria-label="Direction controls">
    <button class="up" id="up" aria-label="Move up">▲</button>
    <button class="left" id="left" aria-label="Move left">◀</button>
    <button class="down" id="down" aria-label="Move down">▼</button>
    <button class="right" id="right" aria-label="Move right">▶</button>
  </div>
  <div class="actions"><button class="primary" id="restart">New Game</button><button id="pause">Pause</button></div>
  <p class="tip">Swipe the board or use the arrows.</p>
</main>
<script>
(()=>{const root=document.getElementById('app'),c=document.getElementById('board'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),ot=document.getElementById('overlayTitle'),ox=document.getElementById('overlayText'),pauseBtn=document.getElementById('pause');const N=20,C=30;let snake,food,dir,next,score,best=Number(localStorage.getItem('snake-best')||0),timer=null,running=false,paused=false,started=false;

function placeFood(){let f;do f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};while(snake.some(s=>s.x===f.x&&s.y===f.y));return f}
function reset(){clearInterval(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next={x:1,y:0};food=placeFood();score=0;running=false;paused=false;started=false;scoreEl.textContent=0;bestEl.textContent=best;pauseBtn.textContent='Pause';ot.textContent='Snake';ox.textContent='Tap a direction or swipe the board to start.';overlay.classList.remove('hidden');draw()}
function speed(){return Math.max(58,145-score*2)}
function start(){if(running||paused)return;running=true;started=true;overlay.classList.add('hidden');timer=setInterval(tick,speed())}
function setDir(dx,dy){if(dx===-dir.x&&dy===-dir.y)return;next={x:dx,y:dy};if(!started)start();else if(paused)resume()}
function resume(){if(!paused)return;paused=false;pauseBtn.textContent='Pause';overlay.classList.add('hidden');timer=setInterval(tick,speed())}
function togglePause(){if(!started)return;if(paused)resume();else{paused=true;running=false;clearInterval(timer);pauseBtn.textContent='Resume';ot.textContent='Paused';ox.textContent='Tap Resume or a direction to continue.';overlay.classList.remove('hidden')}}
function tick(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some((s,i)=>i>0&&s.x===h.x&&s.y===h.y)){gameOver();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;food=placeFood();clearInterval(timer);timer=setInterval(tick,speed())}else snake.pop();draw()}
function gameOver(){clearInterval(timer);running=false;started=false;if(score>best){best=score;localStorage.setItem('snake-best',best)}bestEl.textContent=best;ot.textContent='Game Over';ox.textContent=`Score: ${score}  •  Best: ${best}`;overlay.classList.remove('hidden');draw()}
function draw(){x.fillStyle='#17191e';x.fillRect(0,0,600,600);x.strokeStyle='#242831';x.lineWidth=1;for(let i=1;i<N;i++){x.beginPath();x.moveTo(i*C,0);x.lineTo(i*C,600);x.stroke();x.beginPath();x.moveTo(0,i*C);x.lineTo(600,i*C);x.stroke()}x.fillStyle='#ff5b62';x.beginPath();x.arc(food.x*C+15,food.y*C+15,10,0,Math.PI*2);x.fill();snake.forEach((s,i)=>{x.fillStyle=i===0?'#83ef8d':'#58d66b';x.beginPath();x.roundRect(s.x*C+2.5,s.y*C+2.5,25,25,6);x.fill()})}
document.getElementById('up').onclick=()=>setDir(0,-1);document.getElementById('down').onclick=()=>setDir(0,1);document.getElementById('left').onclick=()=>setDir(-1,0);document.getElementById('right').onclick=()=>setDir(1,0);document.getElementById('restart').onclick=reset;pauseBtn.onclick=togglePause;
root.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')setDir(0,-1);if(k==='arrowdown'||k==='s')setDir(0,1);if(k==='arrowleft'||k==='a')setDir(-1,0);if(k==='arrowright'||k==='d')setDir(1,0);if(k===' ')togglePause()});
let sx=0,sy=0; c.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});c.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1)},{passive:true});reset()})();
</script>
</body>
</html>
