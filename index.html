<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<title>Snake</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#191c22;--grid:#242831;--snake:#58d66b;--head:#9af3a1;--food:#ff5b62;--text:#f5f7fa;--muted:#9aa2ad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;touch-action:none}
body{display:flex;justify-content:center}
.app{width:min(760px,100%);padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;align-items:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:4px 2px 12px}
.title{font-size:30px;font-weight:800;letter-spacing:-1px}
.stats{display:flex;gap:7px}.stat{background:var(--panel);border-radius:12px;padding:7px 10px;text-align:center;min-width:65px}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{font-size:17px}
.game{position:relative;width:min(92vw,640px,50dvh);aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:0 0 0 2px #2b3039;background:#17191e}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,15,.62);backdrop-filter:blur(3px);text-align:center;padding:24px;pointer-events:none}
.overlay.hidden{display:none}.card{background:rgba(25,28,34,.96);border:1px solid #343944;border-radius:20px;padding:24px;max-width:340px}.card h2{margin:0 0 8px;font-size:34px}.card p{margin:0;color:var(--muted);line-height:1.45}
.controls{width:min(330px,90vw);display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
button{font:inherit;border:0;color:var(--text);background:#292e37;border-radius:15px;min-height:58px;font-size:28px;font-weight:800;box-shadow:inset 0 -3px rgba(0,0,0,.25);touch-action:manipulation}
button:active{transform:scale(.95);background:#353b46}
.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}
.actions{display:flex;gap:9px;width:min(330px,90vw);margin-top:10px}.actions button{flex:1;font-size:16px;min-height:48px}.primary{background:#347a45}
.tip{color:var(--muted);font-size:13px;text-align:center;margin:9px 0 0}
@media (orientation:landscape) and (max-height:700px){.app{padding-top:8px}.top{padding-bottom:6px}.game{width:min(62vh,620px)}.controls{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:24px;width:190px;margin:0}.controls button{min-height:56px}.tip{display:none}.actions{margin-top:8px}}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="top">
    <div class="title">🐍 Snake</div>
    <div class="stats">
      <div class="stat"><small>SCORE</small><b id="score">0</b></div>
      <div class="stat"><small>BEST</small><b id="best">0</b></div>
      <div class="stat"><small>LEVEL</small><b id="level">1</b></div>
    </div>
  </div>

  <section class="game" aria-label="Snake game">
    <canvas id="board" width="600" height="600"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="overlayTitle">Snake</h2>
        <p id="overlayText">Tap the board to start. Tap the left or right side to turn.</p>
      </div>
    </div>
  </section>

  <div class="controls" aria-label="Direction controls">
    <button class="up" id="up" aria-label="Move up">▲</button>
    <button class="left" id="left" aria-label="Move left">◀</button>
    <button class="down" id="down" aria-label="Move down">▼</button>
    <button class="right" id="right" aria-label="Move right">▶</button>
  </div>

  <div class="actions">
    <button class="primary" id="restart">New Game</button>
    <button id="pause">Pause</button>
  </div>
  <p class="tip">Tap left/right side of the board to turn • Swipe or arrows also work</p>
</main>

<script>
(() => {
  const root=document.getElementById('app');
  const canvas=document.getElementById('board');
  const gameEl=document.querySelector('.game');
  const ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score');
  const bestEl=document.getElementById('best');
  const levelEl=document.getElementById('level');
  const overlay=document.getElementById('overlay');
  const titleEl=document.getElementById('overlayTitle');
  const textEl=document.getElementById('overlayText');
  const pauseBtn=document.getElementById('pause');

  const N=20, C=30;
  let snake, food, dir, nextDir, score, best, timer=null;
  let running=false, paused=false, started=false;
  let touchStartX=0, touchStartY=0;

  try { best=Number(localStorage.getItem('snake-best')||0); }
  catch { best=0; }

  function speed() {
    return Math.max(58, 145 - Math.floor(score/3)*6);
  }

  function level() {
    return Math.floor(score/5)+1;
  }

  function placeFood() {
    const open=[];
    for(let y=0;y<N;y++) for(let xx=0;xx<N;xx++)
      if(!snake.some(s=>s.x===xx&&s.y===y)) open.push({x:xx,y});
    return open.length ? open[Math.floor(Math.random()*open.length)] : null;
  }

  function reset() {
    clearInterval(timer);
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir={x:1,y:0};
    nextDir={x:1,y:0};
    score=0;
    food=placeFood();
    running=false; paused=false; started=false;
    scoreEl.textContent='0';
    bestEl.textContent=String(best);
    levelEl.textContent='1';
    pauseBtn.textContent='Pause';
    titleEl.textContent='Snake';
    textEl.textContent='Tap the board to start. Tap the left or right side to turn.';
    overlay.classList.remove('hidden');
    draw();
  }

  function start() {
    if(running || paused) return;
    running=true; started=true;
    overlay.classList.add('hidden');
    timer=setInterval(tick,speed());
  }

  function setDir(dx,dy) {
    // Compare against the queued direction, not just the current direction.
    // This prevents rapid taps from creating a 180° turn.
    if(dx===-nextDir.x && dy===-nextDir.y) return;
    nextDir={x:dx,y:dy};
    if(!started) start();
    else if(paused) resume();
  }

  function resume() {
    if(!paused) return;
    paused=false; running=true;
    pauseBtn.textContent='Pause';
    overlay.classList.add('hidden');
    timer=setInterval(tick,speed());
  }

  function togglePause() {
    if(!started || !running && !paused) return;
    if(paused) resume();
    else {
      paused=true; running=false;
      clearInterval(timer);
      pauseBtn.textContent='Resume';
      titleEl.textContent='Paused';
      textEl.textContent='Tap Resume or a direction to continue.';
      overlay.classList.remove('hidden');
    }
  }

  function tick() {
    dir={...nextDir};
    const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};

    if(head.x<0||head.x>=N||head.y<0||head.y>=N) {
      gameOver(); return;
    }

    const eating=head.x===food.x && head.y===food.y;
    // If not eating, the tail moves away this tick, so it is safe to enter
    // the current tail square.
    const bodyToCheck=eating ? snake : snake.slice(0,-1);
    if(bodyToCheck.some(s=>s.x===head.x&&s.y===head.y)) {
      gameOver(); return;
    }

    snake.unshift(head);

    if(eating) {
      score++;
      scoreEl.textContent=String(score);
      levelEl.textContent=String(level());
      food=placeFood();

      if(!food) {
        winGame();
        return;
      }

      clearInterval(timer);
      timer=setInterval(tick,speed());
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver() {
    clearInterval(timer);
    running=false; started=false;
    if(score>best) {
      best=score;
      try { localStorage.setItem('snake-best',String(best)); } catch {}
    }
    bestEl.textContent=String(best);
    titleEl.textContent='Game Over';
    textEl.textContent=`Score: ${score} • Best: ${best} • Tap New Game to play again.`;
    overlay.classList.remove('hidden');
    draw();
  }

  function winGame() {
    clearInterval(timer);
    running=false; started=false;
    titleEl.textContent='You Win!';
    textEl.textContent=`You filled the board with a score of ${score}.`;
    overlay.classList.remove('hidden');
    draw();
  }

  function draw() {
    ctx.fillStyle='#17191e';
    ctx.fillRect(0,0,600,600);

    ctx.strokeStyle='#242831';
    ctx.lineWidth=1;
    for(let i=1;i<N;i++) {
      ctx.beginPath(); ctx.moveTo(i*C,0); ctx.lineTo(i*C,600); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*C); ctx.lineTo(600,i*C); ctx.stroke();
    }

    if(food) {
      ctx.fillStyle='#ff5b62';
      ctx.beginPath();
      ctx.arc(food.x*C+15,food.y*C+15,10,0,Math.PI*2);
      ctx.fill();
    }

    snake.forEach((s,i) => {
      ctx.fillStyle=i===0?'#9af3a1':'#58d66b';
      ctx.beginPath();
      ctx.roundRect(s.x*C+2.5,s.y*C+2.5,25,25,6);
      ctx.fill();
    });
  }

  document.getElementById('up').onclick=()=>setDir(0,-1);
  document.getElementById('down').onclick=()=>setDir(0,1);
  document.getElementById('left').onclick=()=>setDir(-1,0);
  document.getElementById('right').onclick=()=>setDir(1,0);
  document.getElementById('restart').onclick=reset;
  pauseBtn.onclick=togglePause;

  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='BUTTON') return;
    const k=e.key.toLowerCase();
    if(k==='arrowup'||k==='w') setDir(0,-1);
    else if(k==='arrowdown'||k==='s') setDir(0,1);
    else if(k==='arrowleft'||k==='a') setDir(-1,0);
    else if(k==='arrowright'||k==='d') setDir(1,0);
    else if(k===' ') { e.preventDefault(); togglePause(); }
  });

  gameEl.addEventListener('pointerdown',e=>{
    touchStartX=e.clientX; touchStartY=e.clientY;
  });

  gameEl.addEventListener('pointerup',e=>{
    const dx=e.clientX-touchStartX, dy=e.clientY-touchStartY;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20) {
      if(!started) {
        if(titleEl.textContent==='Snake') start();
        return;
      }
      const r=gameEl.getBoundingClientRect();
      if(e.clientX<r.left+r.width/2) setDir(nextDir.y,-nextDir.x);
      else setDir(-nextDir.y,nextDir.x);
      return;
    }
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0);
    else setDir(0,dy>0?1:-1);
  });

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden && running) togglePause();
  });

  reset();

  if('serviceWorker' in navigator && location.protocol==='https:') {
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
